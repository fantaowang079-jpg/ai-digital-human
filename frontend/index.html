<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 数字人 · 对话演示</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="avatar-card">
      <div class="status" id="status"><span class="dot"></span>待机中</div>
      <!-- 数字人 SVG 形象：眼睛会眨眼，嘴巴随语音音量开合 -->
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M60 82 Q100 20 140 82 Q142 60 130 52 Q110 26 100 26 Q90 26 70 52 Q58 60 60 82 Z" fill="#3a3f63" />
        <circle cx="100" cy="105" r="58" fill="#ffe0c7" />
        <circle cx="42" cy="108" r="9" fill="#ffe0c7" />
        <circle cx="158" cy="108" r="9" fill="#ffe0c7" />
        <rect x="72" y="88" width="20" height="4" rx="2" fill="#3a3f63" />
        <rect x="108" y="88" width="20" height="4" rx="2" fill="#3a3f63" />
        <ellipse id="eyeL" cx="82" cy="100" rx="5" ry="7" fill="#2a2f55" />
        <ellipse id="eyeR" cx="118" cy="100" rx="5" ry="7" fill="#2a2f55" />
        <circle cx="72" cy="118" r="6" fill="#ffc4c4" opacity=".6" />
        <circle cx="128" cy="118" r="6" fill="#ffc4c4" opacity=".6" />
        <ellipse id="mouth" cx="100" cy="128" rx="13" ry="4" fill="#c0454f" />
      </svg>
      <div class="status" id="provider" style="margin-top:6px;"></div>
    </div>

    <div class="chat-box" id="chatBox" aria-live="polite"></div>

    <!-- 语音面板：紧贴对话框下方，实时显示音量、判定倒计时与语音检测状态 -->
    <section class="voice-panel" id="voicePanel" data-state="idle" aria-label="语音输入检测">
      <div class="vp-head">
        <span class="vp-status">
          <span class="vp-dot"></span>
          <span id="vpStatusText">语音输入未开启</span>
        </span>
        <span class="vp-timer" id="vpTimer">2.0s</span>
      </div>

      <div class="vp-meter">
        <span class="vp-label">音量</span>
        <div class="vp-track" id="vpLevelTrack">
          <div class="vp-fill" id="vpLevelFill"></div>
          <div class="vp-peak" id="vpLevelPeak"></div>
          <div class="vp-threshold" id="vpThreshold"><span>阈值</span></div>
        </div>
      </div>

      <div class="vp-meter">
        <span class="vp-label">判定</span>
        <div class="vp-track vp-track-countdown">
          <div class="vp-fill vp-countdown" id="vpCountdownFill"></div>
        </div>
      </div>

      <div class="vp-foot">
        <span id="vpHint">点 🎤 开始说话</span>
        <label class="vp-slider">
          停顿
          <input type="range" id="vpSilenceSlider" min="1000" max="4000" step="100" value="2000" />
          <span id="vpSilenceValue">2.0s</span>
        </label>
      </div>
    </section>

    <div class="input-row">
      <button id="mic" title="语音输入">🎤</button>
      <input id="input" type="text" placeholder="打字或点🎤说话…" />
      <button id="send">发送</button>
    </div>
  </div>

  <script src="voice-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
